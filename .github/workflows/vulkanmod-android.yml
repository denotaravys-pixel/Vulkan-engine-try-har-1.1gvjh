name: VulkanMod Android CI/CD

on:
  push:
    branches: [dev, android-arm64]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Build JAR
        run: ./gradlew build
      - name: Upload JAR Android
        uses: actions/upload-artifact@v4
        with:
          name: VulkanMod-Android-${{ github.sha }}
          path: build/libs/VulkanMod*.jar
      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/VulkanMod*.jar
          generate_release_notes: true

  pr-check:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Comment PR success
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            ✅ **Build Android ARM64 PASSOU!**
            📱 [Download JAR](${{ needs.build.outputs.artifact_url }})
            🚀 Merge para liberar VulkanMod Android oficial!
