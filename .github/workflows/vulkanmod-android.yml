name: VulkanMod Android ARM64

on:
  push:
    branches: [android-arm64]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: android-arm64

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install shader tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y glslang-tools spirv-tools
          glslc --version
          spirv-val --version

      - name: Compile shaders (GLSL → SPIR-V 1.1)
        run: |
          OUT="src/main/resources/assets/vulkanmod/shaders"
          mkdir -p "$OUT"
          FAIL=0
          for f in shaders/src/*.vert shaders/src/*.vsh; do
            [ -f "$f" ] || continue
            name=$(basename "${f%.*}")
            glslc -fshader-stage=vertex --target-env=vulkan1.1 -O \
              "$f" -o "$OUT/${name}.vsh.spv" || FAIL=1
          done
          for f in shaders/src/*.frag shaders/src/*.fsh; do
            [ -f "$f" ] || continue
            name=$(basename "${f%.*}")
            glslc -fshader-stage=fragment --target-env=vulkan1.1 -O \
              "$f" -o "$OUT/${name}.fsh.spv" || FAIL=1
          done
          for spv in "$OUT"/*.spv; do
            [ -f "$spv" ] || continue
            spirv-val --target-env vulkan1.1 "$spv" \
              && echo "VALID: $spv" || echo "INVALID: $spv"
          done

      - name: Read version
        id: ver
        run: |
          V=$(grep "^mod_version" gradle.properties | cut -d= -f2 | tr -d ' ')
          echo "v=$V" >> $GITHUB_OUTPUT

      - name: Build JAR
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
          env:
            JAVA_TOOL_OPTIONS: "-Xmx4g"

      - name: Find JAR
        id: jar
        run: |
          J=$(find build/libs/ -name "*.jar" \
            ! -name "*-sources*" ! -name "*-dev*" | head -1)
          echo "path=$J" >> $GITHUB_OUTPUT
          echo "name=$(basename $J)" >> $GITHUB_OUTPUT

      - name: Release (LATEST)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-arm64-${{ github.run_number }}
          name: "Android ARM64 Build #${{ github.run_number }}"
          body: |
            Mali-G52 | Vulkan 1.1 | MC ${{ steps.ver.outputs.v }}
            Commit: ${{ github.sha }}
            No shaderc | Direct draw | INHERIT composite alpha
          files: ${{ steps.jar.outputs.path }}
          make_latest: true
          target_commitish: android-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Comment PR success
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            ✅ **Build Android ARM64 PASSOU!**
            📱 [Download JAR](${{ needs.build.outputs.artifact_url }})
            🚀 Merge para liberar VulkanMod Android oficial!
